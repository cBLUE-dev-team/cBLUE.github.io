name: cblue

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Scientific/data stack
  - numpy
  - pandas
  - numexpr
  - matplotlib
  - sympy
  - mpmath
  - openpyxl

  # LAS/LAZ
  - laspy
  - lazrs-python

  # Utilities
  - python-dateutil
  - pytz
  - setuptools
  - six
  - wheel
  - tqdm

  # Packages installed through PyPI
  - pip:
      - dill
      - multiprocess
      - pathos
      - pox
      - ppft
      - progressbar2
      - python-utils
      - pre-commit
      - black